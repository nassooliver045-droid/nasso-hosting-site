services:
  - type: web
    name: nasso-hosting-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nasso-hosting-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://nasso-hosting-site.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PTERODACTYL_URL
        sync: false
      - key: PTERODACTYL_CLIENT_API_KEY
        sync: false

databases:
  - name: nasso-hosting-db
    databaseName: nasso_hosting
    plan: free
    region: virginia
